version: "3"

services:
    api:
        build: .
        container_name: magalu_api
        ports:
            - "8080:8080"
        environment:
            DATABASE_URL: mongodb://mongo:27017/
            DATABASE_NAME: magalu-db
            TELEGRAM_BOT_TOKEN: token
            TELEGRAM_CHAT_ID: chat
            PORT: 8080
        networks:
            - product-network
        depends_on:
            - mongo
    mongo:
        image: mongo
        container_name: mg-magalu
        ports:
            - "27017:27017"
        environment:
            MONGO_INITDB_ROOT: 
            MONGO_INITDB_PASSWORD: 
            MONGO_INITDB_DATABASE: magalu-db
               
        networks:
            - product-network

networks:
    product-network:
        driver:  "bridge"


  

