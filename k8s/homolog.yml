application:
  name: magalu-stack
  brand: thiago
  flow: npf

deployments:
  container:
    image:
      repository: registry.magalu.com.br
      namespace: magalu-dev
      name: matrix-magalu-test
    resources:
      requests:
        cpu: 0.2
        memory: 512Mi
      limit:
        cpu: 0.2
        memory: 512Mi
    port: 8080
    probe:
      readiness:
        initialDelay: 5
        period: 5
      liveness:
        initialDelay: 5
        period: 5

expose:
  hosts:
    - host: magalu-stack-test-go.pkg.magalu.com.br
      paths:
        - /*
      ssl: false
      public: false
      config: {}

